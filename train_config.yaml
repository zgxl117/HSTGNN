# use a fixed random seed to guarantee that when you run the code twice you will get the same outcome
manual_seed: 3407

dataset:
  split_mode: feature_coverage
  root_dir: "../data/data/spi_5class/test"
  train_val_dirs: ['../data/data/spi_5class/test1/']
  test_dirs: ['../data/data/spi_5class/test1/']
  feature_coverage:
    train_ratio: 0.6
    val_ratio: 0.2
    bins: 3
    min_per_group: 1
    group_feature: hier_id
    features:
      - toggle_rate
      - duty_cycle
      - fanin
      - fanout


loss:
  name: weighted_ce
  class_weights: [1.0, 2.0, 1.0, 1.0, 1.5]

# model configuration
model:
  num_classes: 5
  edge_vector_size: 8
  time_window_size: 60
  num_nodes: 229
  name: ASPP_STGATs
  
  #name: STGCNs
  feat_list: [1, 16, 32, 64, 32]
  dilation_list: [1, 2, 4, 8]
  layer_types: TSTNTSTN

  #name: ASPP_STGCNs
  aspp_dilation_list: [2, 4, 8]
  aspp_t_out_size: 1
  aspp_s_hid_size: 16
  s_feat_size_list: [32, 64, 32, 16]
  control_str: SNSNSN

  #name: ASPP_STGATs
  #aspp_dilation_list: [2, 4, 8]
  #aspp_t_out_size: 1
  #aspp_s_hid_size: 16
  edge_hid_size: 4
  s_feat_size: 16
  num_spatio_layers: 3
  gat_hid_heads: 1


# trainer configuration
trainer:
  epochs: 500
  batch_size: 2
  # path to the checkpoint directory
  checkpoint_dir: FsimNN
  # how many iterations between validations
  validate_after_epochs: 1
  early_stop_patience: 80



# optimizer configuration
optimizer:
  # initial learning rate
  learning_rate: 0.0005
  weight_decay: 0.00001
  factor: 0.5
  patience: 20


